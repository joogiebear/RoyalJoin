# RoyalJoin: pins items to hotbar slots; clicking one runs a command.
# The items below apply in every world. For a world that needs something different,
# add worlds/<world name>.yml (see worlds/_example.yml).
# Apply changes with /royaljoin reload.

items:

  # The key ('menu') is this item's id. Add more entries for more items.
  menu:

    # Hotbar position, 1-9 left to right. 9 is the far-right slot.
    slot: 9

    # Any Minecraft item id.
    material: NETHER_STAR

    # Hover name and lore. '&' colour codes; italics are off by default.
    # PlaceholderAPI placeholders work here when PAPI is installed, refreshed each
    # time the item is applied (join, respawn, world change, /royaljoin reload).
    name: "&6&lMenu"
    lore:
      - "&7Right-click to open the menu."

    # The command to run, without the leading slash. %player% becomes their name;
    # PlaceholderAPI placeholders resolve at the moment of the click.
    command: "menu"

    # Resource-pack icon: sets the item's custom_model_data. Remove for none.
    #custom-model-data: 1001

    # false - run as the player (respects their permissions)
    # true  - run from console (for commands players may not have access to)
    # With true, avoid placeholders whose value players control (nicknames, display
    # names): their text would become part of a command run with full console rights.
    as-console: false

    # Which click opens it: right, left, or either.
    click: right

    # Leave empty to give it to everyone, or require a permission node. Checked
    # again at every click, so a player who loses it can't keep using the item.
    permission: ""

    # Narrow this one item to certain worlds without giving them their own file.
    # Empty list = every world.
    #   blacklist - every world EXCEPT those listed
    #   whitelist - ONLY the worlds listed
    worlds: []
    world-mode: blacklist

    # true - can't be moved, dropped, stored in a chest, swapped to the off-hand,
    #        or put in an item frame or on an armor stand.
    # These items never drop on death either way; respawning hands out a fresh one.
    locked: true

    # Adds the enchantment shimmer without an enchantment.
    glow: false

# Rate limiting: the gap stops a menu re-opening while a click is held; the burst
# guard catches auto-clickers firing at exactly the gap interval.
cooldown:
  # Minimum milliseconds between two activations.
  between-uses-ms: 400

  # This many activations inside the window trips a lockout. 0 disables the guard.
  spam-threshold: 6
  spam-window-ms: 3000

  # How long the item ignores clicks once tripped.
  lockout-seconds: 5

  # Sent once, when the lockout starts. %seconds% is how long it lasts.
  # Leave empty to say nothing at all.
  message: "&cEasy, that's on cooldown for %seconds%s."

settings:
  # Logs every click on one of these items and what the command did. Turn on when a
  # button isn't doing what you expect; leave off otherwise.
  debug: false
